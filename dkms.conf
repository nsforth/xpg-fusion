PACKAGE_NAME="xpg-fusion"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="xpg-fusion"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make all"
# Required for automatic rebuild on kernel upgrades: dkms 3.x only
# autoinstalls modules whose dkms.conf explicitly sets AUTOINSTALL="yes".
# Note: dkms 3.x only accepts the full words "yes"/"no" here; the old
# dkms 2.x value "y" is rejected with "Unsupported AUTOINSTALL value".
# (AUTO_DEPEND is not a real dkms.conf key; no dependencies are needed:
# CONFIG_USB=y, CONFIG_HWMON=y are built-in in Ubuntu 26.04 generic.)
AUTOINSTALL="yes"
